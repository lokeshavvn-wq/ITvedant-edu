<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owl Blog</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#eef5f8;
color:#333;
line-height:1.6;
}

header{
height:70vh;
background:url("https://source.unsplash.com/1600x900/?owl,forest") center/cover;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

header::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,.5);
}

.hero{
position:relative;
z-index:1;
text-align:center;
color:white;
}

.hero h1{
font-size:60px;
margin-bottom:15px;
}

.hero p{
font-size:22px;
}

.container{
width:90%;
max-width:1200px;
margin:50px auto;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:30px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.12);
transition:.3s;
}

.card:hover{
transform:translateY(-10px);
}

.card img{
width:100%;
height:240px;
object-fit:cover;
}

.content{
padding:20px;
}

.content h2{
margin-bottom:10px;
color:#2c3e50;
}

.content p{
margin-bottom:15px;
}

button{
background:#2d8f5d;
color:white;
padding:12px 20px;
border:none;
border-radius:30px;
cursor:pointer;
font-size:15px;
transition:.3s;
}

button:hover{
background:#226d47;
}

footer{
margin-top:60px;
padding:30px;
text-align:center;
background:#1d2731;
color:white;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.7);
display:none;
justify-content:center;
align-items:center;
padding:20px;
}

.modal-content{
background:white;
max-width:700px;
border-radius:15px;
overflow:hidden;
animation:fade .4s;
}

.modal-content img{
width:100%;
height:400px;
object-fit:cover;
}

.modal-body{
padding:25px;
}

.close{
float:right;
font-size:30px;
cursor:pointer;
}

@keyframes fade{
from{
transform:scale(.8);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

@media(max-width:700px){

.hero h1{
font-size:40px;
}

.hero p{
font-size:18px;
}

}
</style>
</head>
<body>

<header>
<div class="hero">
<h1>🦉 Owl World</h1>
<p>Discover the mysterious life of owls.</p>
</div>
</header>

<div class="container">

<div class="grid" id="blogGrid"></div>

</div>

<div class="modal" id="modal">

<div class="modal-content">

<img id="modalImg">

<div class="modal-body">

<span class="close" onclick="closeModal()">&times;</span>

<h2 id="modalTitle"></h2>

<p id="modalText"></p>

</div>

</div>

</div>

<footer>
<h3>Owl Blog</h3>
<p>Made with HTML, CSS & JavaScript</p>
</footer>

<script>

const posts=[

{
title:"The Silent Hunter",
img:"https://source.unsplash.com/800x600/?owl",
text:"Owls are expert hunters capable of flying almost silently thanks to their specialized feathers. Their incredible hearing allows them to locate prey even beneath snow or leaves."
},

{
title:"Amazing Night Vision",
img:"https://source.unsplash.com/800x600/?barn-owl",
text:"Owls possess enormous eyes that gather large amounts of light. They cannot move their eyes, so they rotate their heads up to 270 degrees."
},

{
title:"Owls Around the World",
img:"https://source.unsplash.com/800x600/?snowy-owl",
text:"More than 250 owl species live across nearly every continent, from frozen tundras to tropical rainforests."
},

{
title:"Forest Guardians",
img:"https://source.unsplash.com/800x600/?owl,bird",
text:"Owls play a vital role in ecosystems by controlling rodent populations and maintaining ecological balance."
},

{
title:"Baby Owls",
img:"https://source.unsplash.com/800x600/?owl,animal",
text:"Young owls, called owlets, are born covered in soft white down feathers and rely on their parents for food."
},

{
title:"Wisdom Symbol",
img:"https://source.unsplash.com/800x600/?eagle-owl",
text:"Throughout history, owls have symbolized wisdom, mystery, intelligence, and knowledge in many cultures."
}

];

const grid=document.getElementById("blogGrid");

posts.forEach(post=>{

grid.innerHTML+=`

<div class="card">

<img src="${post.img}" alt="Owl">

<div class="content">

<h2>${post.title}</h2>

<p>${post.text.substring(0,100)}...</p>

<button onclick='showPost(${JSON.stringify(post)})'>
Read More
</button>

</div>

</div>

`;

});

function showPost(post){

document.getElementById("modal").style.display="flex";

document.getElementById("modalImg").src=post.img;

document.getElementById("modalTitle").innerHTML=post.title;

document.getElementById("modalText").innerHTML=post.text;

}

function closeModal(){

document.getElementById("modal").style.display="none";

}

window.onclick=function(e){

if(e.target==document.getElementById("modal")){

closeModal();

}

}

</script>

</body>
</html>
